[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "patientalarm"
version = "0.1.0"
description = "PatientAlarm implementation"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2", "scipy>=1.10", "scikit-learn>=1.3", "mne>=1.6", "torch>=2.1", "matplotlib>=3.7"]

[tool.setuptools.packages.find]
include = ["patientalarm*"]
